<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link encoder</title>
<style>body{font-family:system-ui;max-width:560px;margin:30px auto;padding:0 16px}input,textarea,button{width:100%;font:inherit;padding:10px;margin:6px 0;box-sizing:border-box}</style></head><body>
<h2>Private link encoder</h2>
<p>Paste your Roblox private server link, press Encode, then copy the result into <code>config.js</code>.</p>
<input id="i" placeholder="https://www.roblox.com.ss/games/131623223084840/Escape-Tsunami-For-Brainrots?privateServerLinkCode=76715998440714522134179950725634">
<button onclick="o.value='var PRIVATE_LINK_B64=\"'+btoa(i.value.trim())+'\";'">Encode</button>
<textarea id="o" rows="4" readonly placeholder="Result appears here"></textarea>
<button onclick="o.select();document.execCommand('copy')">Copy</button>
<p>Keep this file on your computer. You don't need to upload it to GitHub.</p></body></html>
